openapi: 3.0.3

info:
  title: Demo Payments API
  version: 1.0.0
  description: |
    Simple fintech API for testing payment flows similar to Stripe.

servers:
  - url: https://api.example.com/v1

paths:

  /customers:
    post:
      summary: Create customer
      description: Creates a new customer object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: user@example.com
                name:
                  type: string
                  example: John Doe
      responses:
        "200":
          description: Customer created
          content:
            application/json:
              example:
                id: cus_123
                email: user@example.com
                name: John Doe

    get:
      summary: List customers
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              example:
                data:
                  - id: cus_123
                    email: user@example.com

  /payments:
    post:
      summary: Create payment
      description: Create a payment intent (like Stripe PaymentIntent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: integer
                  example: 1999
                currency:
                  type: string
                  example: usd
                customer_id:
                  type: string
                  example: cus_123
      responses:
        "200":
          description: Payment created
          content:
            application/json:
              example:
                id: pay_123
                status: succeeded
                amount: 1999
                currency: usd

  /payments/{payment_id}:
    get:
      summary: Retrieve payment
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment details
          content:
            application/json:
              example:
                id: pay_123
                status: succeeded

  /refunds:
    post:
      summary: Create refund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_id
              properties:
                payment_id:
                  type: string
                  example: pay_123
                amount:
                  type: integer
                  example: 500
      responses:
        "200":
          description: Refund created
          content:
            application/json:
              example:
                id: ref_123
                status: succeeded

  /invoices:
    post:
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - amount
              properties:
                customer_id:
                  type: string
                  example: cus_123
                amount:
                  type: integer
                  example: 5000
      responses:
        "200":
          description: Invoice created
          content:
            application/json:
              example:
                id: inv_123
                status: open
                amount: 5000

  /webhooks:
    post:
      summary: Webhook receiver
      description: Handles events like payment.succeeded
      requestBody:
        required: true
        content:
          application/json:
            example:
              event: payment.succeeded
              data:
                id: pay_123
      responses:
        "200":
          description: OK
